# nginx for the testnet API, inside the caged nginx container (uid 2100, read-only root).
# Cloudflare reaches it on $API_PORT (an Origin Rule on testnet-api.outlayer.ai); DOCKER-USER
# admits Cloudflare's ranges only. The cert is a Cloudflare Origin CA cert: the record must
# stay proxied. The retired name testnet-api.outlayer.fastnear.com is not served here (its
# zone is out of our hands); the old host answers it with "moved".
worker_processes 4;   # not auto: the node has 128 CPUs, the API needs a few
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # cf_cert: whether the client presented our Cloudflare origin-pull certificate.
  log_format main_cf '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_user_agent" cf_cert=$ssl_client_verify '
                     # rt: seconds spent here; reqs: 1 = Cloudflare opened a new connection for this
                     # request; ray: Cloudflare's request id, ending in the edge's code (-FRA);
                     # probe: the health collector's X-Probe-Id, to find one of its polls.
                     'rt=$request_time reqs=$connection_requests ray=$http_cf_ray probe=$http_x_probe_id';
  access_log /dev/stdout main_cf;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # The client's address, from Cloudflare only. Never list 127.0.0.1 or a docker
  # gateway here: a local connection does not pass DOCKER-USER, and trusted it would
  # name its own X-Real-IP, which WORKER_ALLOWED_IPS and the per-IP limits rely on.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream coordinator {
    server coordinator:8080 fail_timeout=0;
  }

  # An unknown name gets no certificate at all.
  server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
  }

  server {
    listen 8443 ssl;
    server_name testnet-api.outlayer.ai;
    ssl_certificate     /etc/nginx/certs/outlayer.ai.pem;
    ssl_certificate_key /etc/nginx/certs/outlayer.ai.key;
    # Authenticated Origin Pulls with OUR certificate (per-hostname, uploaded to Cloudflare for
    # this name only): any Cloudflare IP passes DOCKER-USER, but only our zone's requests
    # carry this client certificate. Not Cloudflare's shared AOP certificate, which every
    # Cloudflare customer can present.
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;   # no certificate, or another one: the handshake is refused (400)
    client_max_body_size 10M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Proxy "";
      proxy_pass_header Server;
      proxy_pass http://coordinator;
      proxy_buffering off;
      proxy_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      tcp_nodelay on;
    }
  }
}
